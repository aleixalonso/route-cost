name: E2E

# Runs on the PR only: a squash merge keeps the tree the PR validated, so a push run repeats the same work for the same minutes.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - run: npm i -g pnpm@10.34.3
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @route-cost/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-test-results
          path: apps/e2e/test-results/
